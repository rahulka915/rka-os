    <text x="1190" y="90" font-size="38" font-weight="700">Rive assembly guide</text><text x="1190" y="135" font-size="25" fill="#aeb5bf">Ronin raster modular v1</text><text x="1190" y="205" font-size="25" font-weight="700" fill="#ffce45">Yellow = rotation pivot</text><text x="1190" y="245" font-size="25" font-weight="700" fill="#50e3ff">Blue = bone chain</text>
    <text x="1190" y="320" font-size="27" font-weight="700">Hierarchy</text><text x="1190" y="365" font-size="23">Side_Root</text><text x="1215" y="402" font-size="23">Pelvis</text><text x="1240" y="439" font-size="23">Torso → Neck → Head</text><text x="1240" y="476" font-size="23">Rear arm → Forearm → Hand</text><text x="1240" y="513" font-size="23">Front arm → Forearm → Hand</text><text x="1240" y="550" font-size="23">Rear thigh → Shin → Boot</text><text x="1240" y="587" font-size="23">Front thigh → Shin → Boot</text>
